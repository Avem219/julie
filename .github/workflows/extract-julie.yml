name: Extract Julie App

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to julie-app.zip (leave blank to auto-detect)"
        required: false
        default: ""
      commit_changes:
        description: "Commit extracted Julie app to the repository"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -200

      - name: Locate Julie ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          INPUT_ZIP="${{ inputs.zip_path }}"

          if [ -n "$INPUT_ZIP" ]; then
            if [ ! -f "$INPUT_ZIP" ]; then
              echo "::error::ZIP not found at: $INPUT_ZIP"
              exit 1
            fi

            ZIP="$INPUT_ZIP"
          else
            echo "Searching repository for julie-app.zip..."

            ZIP="$(find . \
              -type f \
              -iname 'julie-app.zip' \
              ! -path './.git/*' \
              -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::Could not find julie-app.zip anywhere in the repository."
              echo
              echo "ZIP files currently present:"
              find . \
                -type f \
                -iname '*.zip' \
                ! -path './.git/*' \
                -print || true
              exit 1
            fi
          fi

          ZIP="$(realpath "$ZIP")"

          echo "Found ZIP:"
          echo "$ZIP"

          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.locate.outputs.zip_path }}"

          echo "ZIP contents:"
          unzip -l "$ZIP" | head -300

      - name: Extract Julie application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.locate.outputs.zip_path }}"
          EXTRACT_DIR="$RUNNER_TEMP/julie-extracted"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo
          echo "Initial extraction:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f | sort | head -300

      - name: Detect application root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/julie-extracted"

          # If package.json is directly at the extraction root,
          # that is already the application root.
          if [ -f "$EXTRACT_DIR/package.json" ]; then
            APP_ROOT="$EXTRACT_DIR"
          else
            # Otherwise find the first directory containing package.json.
            APP_ROOT="$(
              find "$EXTRACT_DIR" \
                -mindepth 1 \
                -maxdepth 4 \
                -type f \
                -name 'package.json' \
                -print \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$APP_ROOT" ] || [ ! -f "$APP_ROOT/package.json" ]; then
            echo "::error::Could not locate package.json inside julie-app.zip."
            echo
            echo "Extracted structure:"
            find "$EXTRACT_DIR" -maxdepth 5 -print | sort | head -500
            exit 1
          fi

          echo "Julie application root:"
          echo "$APP_ROOT"

          echo "app_root=$APP_ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate extracted application
        shell: bash
        run: |
          set -euo pipefail

          APP_ROOT="${{ steps.root.outputs.app_root }}"

          echo "Checking Julie application..."

          test -f "$APP_ROOT/package.json"

          echo
          echo "package.json:"
          cat "$APP_ROOT/package.json"

          echo
          echo "Application files:"
          find "$APP_ROOT" \
            -maxdepth 3 \
            -type f \
            ! -path '*/node_modules/*' \
            | sort \
            | head -500

      - name: Replace repository with Julie application
        shell: bash
        run: |
          set -euo pipefail

          APP_ROOT="${{ steps.root.outputs.app_root }}"
          ZIP="${{ steps.locate.outputs.zip_path }}"

          echo "Preparing repository replacement..."

          # Preserve Git metadata.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          # Copy the extracted application into the repository.
          cp -a "$APP_ROOT"/. .

          # Do not accidentally commit the source ZIP.
          if [ -f "$ZIP" ]; then
            ZIP_REL="${ZIP#$(pwd)/}"
            if [ -n "$ZIP_REL" ] && [ -f "$ZIP_REL" ]; then
              rm -f "$ZIP_REL"
            fi
          fi

          echo
          echo "Repository after extraction:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -500

      - name: Verify Julie project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying required project files..."

          test -f package.json

          echo "package.json found."

          if [ -f "next.config.js" ] || \
             [ -f "next.config.mjs" ] || \
             [ -f "next.config.ts" ]; then
            echo "Next.js configuration detected."
          fi

          if [ -f "prisma/schema.prisma" ]; then
            echo "Prisma schema detected."
          fi

          if [ -d "src" ]; then
            echo "src/ directory detected."
          fi

          echo
          echo "Git status:"
          git status --short

      - name: Commit extracted application
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "Extract completed Julie application"

          git push

      - name: Final summary
        shell: bash
        run: |
          echo "======================================"
          echo " JULIE EXTRACTION COMPLETE"
          echo "======================================"
          echo
          echo "The Julie application has been extracted."
          echo
          echo "Repository:"
          git rev-parse --show-toplevel
          echo
          echo "Commit:"
          git rev-parse HEAD
          echo
          echo "Top-level structure:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -200
